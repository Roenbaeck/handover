[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spike"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
handover-core = { path = "crates/handover-core" }
handover-protocol = { path = "crates/handover-protocol" }
handover-register = { path = "crates/handover-register" }
handover-proxy = { path = "crates/handover-proxy" }
handover-mock = { path = "crates/handover-mock" }

positorium = { version = "=0.3.3-beta.8", default-features = false, features = ["persistence"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
hex = "0.4"
globset = "0.4"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
