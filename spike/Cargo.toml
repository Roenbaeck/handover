[package]
name = "positorium-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Phase 1 spike: validate the handover register design against Positorium 0.3.1-beta.6"

[dependencies]
positorium = { version = "=0.3.1-beta.6", default-features = false, features = ["persistence"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = false
